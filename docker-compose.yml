services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karat
      POSTGRES_PASSWORD: karat
      POSTGRES_DB: karat
    ports:
      - "5432:5432"
    volumes:
      - karat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karat -d karat"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      PG_HOST: db
      PG_PORT: "5432"
      PG_DATABASE: karat
      PG_USERNAME: karat
      PG_PASSWORD: karat
      PG_SSL_MODE: disable
      PG_SCHEMA: karat
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-942973487076-75esdqolvo0ropi4hjq23rcr8mvdnu3b.apps.googleusercontent.com,942973487076-8f5enjqlaclf3qs4526o75qbg4hhj4nf.apps.googleusercontent.com}
      DEV_LOGIN: ${DEV_LOGIN:-false}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_ACCESS_KEY_SECRET: ${R2_ACCESS_KEY_SECRET:-}
      R2_ENV: ${R2_ENV:-local}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  karat-pg:
