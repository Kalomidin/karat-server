services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karat
      POSTGRES_PASSWORD: karat
      POSTGRES_DB: karat
    ports:
      - "5432:5432"
    volumes:
      - karat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karat -d karat"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://karat:karat@db:5432/karat?sslmode=disable
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-942973487076-75esdqolvo0ropi4hjq23rcr8mvdnu3b.apps.googleusercontent.com}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-UTC}
      DEV_LOGIN: ${DEV_LOGIN:-0}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  karat-pg:
